name: Test Build

# Builds a test baitbox binary the same way as release.yml (static musl cgo
# build in the pinned golang alpine image, no dev tag so it targets Let's
# Encrypt) and keeps it as a workflow artifact for review. Nothing is published.
# The binaries are signed with the release key, the same as release.yml, and
# the .sig is packaged beside the binary. The build fails if SIGNKEY_1 is missing.
#
# The admin SPA is built first in a throwaway container that sees only the
# frontend directory, with npm install scripts off.
#
# Trigger: push to the test-build branch, or run it by hand. A push builds
# amd64 only; a manual run can tick build_arm to also build arm64.

on:
  push:
    branches: [test-build]
  workflow_dispatch:
    inputs:
      build_arm:
        description: "Also build arm64 (default builds amd64 only)"
        type: boolean
        default: false

env:
  BUILD_ARM: ${{ github.event.inputs.build_arm || 'false' }}

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      # npm runs in a throwaway container that sees only a read only copy of
      # frontend/ and writes only frontend/build. It runs before any secret is
      # written. npm ci installs exactly what package-lock.json pins and install
      # scripts are skipped (esbuild finds its binary through its optional
      # platform package without one).
      - name: Build admin SPA
        run: |
          mkdir -p spa-out
          docker run --rm \
            -v "$(pwd)/frontend":/src:ro \
            -v "$(pwd)/spa-out":/out \
            node@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 `# node:22-slim` \
            sh -c "cp -r /src /work && rm -rf /work/node_modules /work/build /work/.svelte-kit && cd /work \
              && npm ci --ignore-scripts --no-audit --no-fund && npm run build && cp -r build/. /out/ \
              && chown -R $(id -u):$(id -g) /out"
          rm -rf frontend/build
          mv spa-out frontend/build

      # arm64 is built under emulation, so the arm64 golang image can run on the
      # amd64 runner. only needed when arm64 is built.
      - name: Set up QEMU
        if: env.BUILD_ARM == 'true'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Extract version info
        id: version
        run: |
          echo "VERSION=test-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Cache Go build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/go-build-cache
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Build binaries
        run: |
          mkdir -p build/amd64 build/arm64 /tmp/go-build-cache
          LDFLAGS="-X main.version=${{ steps.version.outputs.VERSION }}+${{ steps.version.outputs.HASH }} -linkmode=external -extldflags=-static"

          sudo docker run --rm \
            -v "$(pwd)":/app \
            -v /tmp/go-build-cache:/root/.cache/go-build \
            -w /app \
            golang@sha256:bff16a94c0b4b6d9642581e2a3aa81beb3edb940b2f5a3aac1d22c6a68cb7747 `# golang:1.27.3-alpine linux/amd64` \
            sh -c "apk add --no-cache gcc=15.2.0-r5 musl-dev=1.2.6-r3 && go build -trimpath -mod vendor -ldflags='$LDFLAGS' -o /app/build/amd64/baitbox ."

          if [ "${BUILD_ARM}" = "true" ]; then
            sudo docker run --rm \
              --platform linux/arm64 \
              -v "$(pwd)":/app \
              -w /app \
              golang@sha256:ee0dcdc452cb73890363fbef65fc333aeb0da7c24ba52f2c6428a37b0e7f4f1c `# golang:1.27.3-alpine linux/arm64` \
              sh -c "apk add --no-cache gcc=15.2.0-r5 musl-dev=1.2.6-r3 && go build -trimpath -mod vendor -ldflags='$LDFLAGS' -o /app/build/arm64/baitbox ."
          else
            echo "BUILD_ARM not enabled, skipping arm64 build"
          fi

      - name: Fix build directory permissions
        run: |
          sudo chown -R $USER:$USER build/
          ls -la build/amd64 build/arm64

      - name: Sign binaries with Ed25519
        env:
          SIGNKEY_1: ${{ secrets.SIGNKEY_1 }}
        run: |
          if [ -z "$SIGNKEY_1" ]; then
            echo "SIGNKEY_1 secret is missing" >&2
            exit 1
          fi
          mkdir -p /tmp/keys
          chmod 700 /tmp/keys
          printf '%s\n' "$SIGNKEY_1" > /tmp/keys/private1.pem
          chmod 600 /tmp/keys/private1.pem
          for arch in amd64 arm64; do
            [ -f build/$arch/baitbox ] || continue
            openssl pkeyutl -sign -inkey /tmp/keys/private1.pem -rawin \
              -in build/$arch/baitbox -out build/$arch/baitbox.sig
          done
          rm -rf /tmp/keys

      - name: Package binaries with their signatures
        run: |
          mkdir -p packages
          for arch in amd64 arm64; do
            [ -f build/$arch/baitbox ] || continue
            tar -czf packages/baitbox_${{ steps.version.outputs.VERSION }}_linux_$arch.tar.gz \
              -C build/$arch baitbox baitbox.sig
          done

      - name: Verify build artifacts
        run: |
          for arch in amd64 arm64; do
            [ -f build/$arch/baitbox ] || continue
            echo "=== $arch ==="
            file build/$arch/baitbox
            du -h build/$arch/baitbox
            du -h build/$arch/baitbox.sig
            tar -tzf packages/baitbox_${{ steps.version.outputs.VERSION }}_linux_$arch.tar.gz
          done

      - name: Upload build artifacts (for review)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baitbox-test-build-${{ steps.version.outputs.HASH }}
          # arm64 paths are only present when BUILD_ARM is enabled
          if-no-files-found: ignore
          path: |
            build/amd64/baitbox
            build/amd64/baitbox.sig
            build/arm64/baitbox
            build/arm64/baitbox.sig
            packages/*.tar.gz
          retention-days: 2
