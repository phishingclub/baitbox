name: Release

# Publishes a signed baitbox release so the self update (install/update.go) can
# find it on the GitHub releases API, verify its Ed25519 signature against the
# embedded public key, and swap the binary in. It mirrors the build in
# test-build.yml (static musl cgo build in the pinned golang alpine image) for both
# linux/amd64 and linux/arm64, and adds the GitHub Release publish step that the
# updater reads. The same binaries are then pushed as a multi arch image to
# ghcr.io/<repo> tagged latest and the version.
#
# Trigger: push a semver tag like v1.2.3. The updater compares semver, so the
# tag must be valid semver or the downgrade guard will refuse the update.
#
# The admin SPA is built first in a throwaway container that sees only the
# frontend directory, with npm install scripts off. The container has exited
# before the signing key is written.
#
# Required repo secret: SIGNKEY_1, the PEM Ed25519 private key whose public half
# is embedded at embedded/signingkeys/public1.bin.

# only a tag push runs this workflow, so the release key never signs a branch
# build; the release job also checks the ref itself.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      # npm runs in a throwaway container that sees only a read only copy of
      # frontend/ and writes only frontend/build. It runs before any secret is
      # written. npm ci installs exactly what package-lock.json pins and install
      # scripts are skipped (esbuild finds its binary through its optional
      # platform package without one).
      - name: Build admin SPA
        run: |
          mkdir -p spa-out
          docker run --rm \
            -v "$(pwd)/frontend":/src:ro \
            -v "$(pwd)/spa-out":/out \
            node@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 `# node:22-slim` \
            sh -c "cp -r /src /work && rm -rf /work/node_modules /work/build /work/.svelte-kit && cd /work \
              && npm ci --ignore-scripts --no-audit --no-fund && npm run build && cp -r build/. /out/ \
              && chown -R $(id -u):$(id -g) /out"
          rm -rf frontend/build
          mv spa-out frontend/build

      # arm64 is built under emulation, so the arm64 golang image can run on the
      # amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64

      # the tag filter above is a glob, so a tag such as v1.2.3$(cmd) would still
      # match. the version is pasted into later run scripts, so only a plain
      # vMAJOR.MINOR.PATCH tag is let through.
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not a plain vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      # no Go build cache: release builds are infrequent and produce a signed,
      # published binary, so a clean compile keeps cached objects out of the
      # signing path. Each arch pins its own golang:1.27.3-alpine image digest,
      # the same as test-build.yml.
      - name: Build binaries
        run: |
          mkdir -p build/amd64 build/arm64
          LDFLAGS="-X main.version=${{ steps.version.outputs.VERSION }} -linkmode=external -extldflags=-static"

          sudo docker run --rm \
            -v "$(pwd)":/app \
            -w /app \
            golang@sha256:bff16a94c0b4b6d9642581e2a3aa81beb3edb940b2f5a3aac1d22c6a68cb7747 `# golang:1.27.3-alpine linux/amd64` \
            sh -c "apk add --no-cache gcc=15.2.0-r5 musl-dev=1.2.6-r3 && go build -trimpath -mod vendor -ldflags='$LDFLAGS' -o /app/build/amd64/baitbox ."

          sudo docker run --rm \
            --platform linux/arm64 \
            -v "$(pwd)":/app \
            -w /app \
            golang@sha256:ee0dcdc452cb73890363fbef65fc333aeb0da7c24ba52f2c6428a37b0e7f4f1c `# golang:1.27.3-alpine linux/arm64` \
            sh -c "apk add --no-cache gcc=15.2.0-r5 musl-dev=1.2.6-r3 && go build -trimpath -mod vendor -ldflags='$LDFLAGS' -o /app/build/arm64/baitbox ."

      - name: Fix build directory permissions
        run: |
          sudo chown -R $USER:$USER build/
          ls -la build/amd64 build/arm64

      - name: Sign binaries with Ed25519
        env:
          SIGNKEY_1: ${{ secrets.SIGNKEY_1 }}
        run: |
          mkdir -p /tmp/keys
          chmod 700 /tmp/keys
          printf '%s\n' "$SIGNKEY_1" > /tmp/keys/private1.pem
          chmod 600 /tmp/keys/private1.pem
          openssl pkeyutl -sign -inkey /tmp/keys/private1.pem -rawin \
            -in build/amd64/baitbox -out build/amd64/baitbox.sig
          openssl pkeyutl -sign -inkey /tmp/keys/private1.pem -rawin \
            -in build/arm64/baitbox -out build/arm64/baitbox.sig
          rm -rf /tmp/keys

      - name: Package binaries with their signatures
        run: |
          mkdir -p packages
          tar -czf packages/baitbox_${{ steps.version.outputs.VERSION }}_linux_amd64.tar.gz \
            -C build/amd64 baitbox baitbox.sig
          tar -czf packages/baitbox_${{ steps.version.outputs.VERSION }}_linux_arm64.tar.gz \
            -C build/arm64 baitbox baitbox.sig

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.TAG }} --repo "$GITHUB_REPOSITORY" \
            ./packages/baitbox_${{ steps.version.outputs.VERSION }}_linux_amd64.tar.gz \
            ./packages/baitbox_${{ steps.version.outputs.VERSION }}_linux_arm64.tar.gz \
            --title "${{ steps.version.outputs.TAG }}" \
            --generate-notes

      # the image is built from the same signed binaries as the release assets.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi arch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Bait Box ${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.description=Bait Box production release image (linux/amd64, linux/arm64). Built from tag ${{ steps.version.outputs.TAG }}.
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
